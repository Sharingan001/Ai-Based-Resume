name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Compile C++ score utility
        run: mkdir -p cpp/build && g++ -std=c++17 -Wall -Wextra -Werror -O2 cpp/main.cpp -o cpp/build/nexus_score.exe
      - name: Test backend, extraction and C++
        run: python -m unittest discover -s tests -v
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=moderate
