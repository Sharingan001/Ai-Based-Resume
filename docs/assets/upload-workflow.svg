<svg xmlns="http://www.w3.org/2000/svg" width="950" height="720" viewBox="0 0 950 720" role="img" aria-labelledby="title desc"><title id="title">Resume upload and matching workflow</title><desc id="desc">Six steps: upload, extract and validate, synchronize and save, review profile, request matches, explore scores and skill gaps.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#77cfbf"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#111827"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e5edf7"><text x="30" y="42" font-size="25" fill="#e5edf7">From upload to matchup</text><circle cx="54" cy="108" r="21" fill="#285c60"/><text x="48" y="115" font-size="19" fill="#e5edf7">1</text><rect x="100" y="75" width="810" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="116" y="106" font-size="18" fill="#e5edf7">Upload a resume</text><text x="116" y="132" font-size="14" fill="#a8bacd">React sends POST /api/upload with a PDF, DOCX or TXT file.</text><path d="M54 131 L54 175" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><circle cx="54" cy="212" r="21" fill="#285c60"/><text x="48" y="219" font-size="19" fill="#e5edf7">2</text><rect x="100" y="179" width="810" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="116" y="210" font-size="18" fill="#e5edf7">Extract and validate facts</text><text x="116" y="236" font-size="14" fill="#a8bacd">FastAPI reads bounded text, calls local Qwen, and checks output against the source.</text><path d="M54 235 L54 279" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><circle cx="54" cy="316" r="21" fill="#285c60"/><text x="48" y="323" font-size="19" fill="#e5edf7">3</text><rect x="100" y="283" width="810" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="116" y="314" font-size="18" fill="#e5edf7">Synchronize and save</text><text x="116" y="340" font-size="14" fill="#a8bacd">Rebuild the resume index, then commit candidate state to SQLite.</text><path d="M54 339 L54 383" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><circle cx="54" cy="420" r="21" fill="#285c60"/><text x="48" y="427" font-size="19" fill="#e5edf7">4</text><rect x="100" y="387" width="810" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="116" y="418" font-size="18" fill="#e5edf7">Review the profile</text><text x="116" y="444" font-size="14" fill="#a8bacd">Return structured fields, parser method and extraction warnings.</text><path d="M54 443 L54 487" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><circle cx="54" cy="524" r="21" fill="#285c60"/><text x="48" y="531" font-size="19" fill="#e5edf7">5</text><rect x="100" y="491" width="810" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="116" y="522" font-size="18" fill="#e5edf7">Run this resume’s job matches</text><text x="116" y="548" font-size="14" fill="#a8bacd">GET /api/candidates/{id}/matches compares the resume with active jobs.</text><path d="M54 547 L54 591" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><circle cx="54" cy="628" r="21" fill="#285c60"/><text x="48" y="635" font-size="19" fill="#e5edf7">6</text><rect x="100" y="595" width="810" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="116" y="626" font-size="18" fill="#e5edf7">Explore the results</text><text x="116" y="652" font-size="14" fill="#a8bacd">Return sorted scores, matched skills and missing skills to the workspace.</text></g></svg>