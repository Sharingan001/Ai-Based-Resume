<svg xmlns="http://www.w3.org/2000/svg" width="990" height="590" viewBox="0 0 990 590" role="img" aria-labelledby="title desc"><title id="title">Nexus HR architecture</title><desc id="desc">React calls FastAPI. Documents pass through text extraction, local Qwen and source validation into SQLite. A synchronized in-memory TF-IDF index feeds weighted matching.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#77cfbf"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#111827"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e5edf7"><text x="30" y="40" font-size="24" fill="#e5edf7">Architecture · local extraction and deterministic matching</text><text x="30" y="72" font-size="16" fill="#a8bacd">React sends requests to FastAPI; candidate and job state persists in SQLite.</text><rect x="30" y="110" width="245" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="46" y="141" font-size="18" fill="#e5edf7">React workspace</text><text x="46" y="167" font-size="14" fill="#a8bacd">Upload · profiles · matchups</text><rect x="355" y="110" width="245" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="371" y="141" font-size="18" fill="#e5edf7">FastAPI</text><text x="371" y="167" font-size="14" fill="#a8bacd">Validation · application logic</text><rect x="680" y="110" width="245" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="696" y="141" font-size="18" fill="#e5edf7">SQLite state</text><text x="696" y="167" font-size="14" fill="#a8bacd">Transactional local persistence</text><path d="M275 150 L355 150" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 150 L680 150" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="270" width="245" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="46" y="301" font-size="18" fill="#e5edf7">Document text reader</text><text x="46" y="327" font-size="14" fill="#a8bacd">PDF · DOCX · TXT</text><rect x="355" y="270" width="245" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="371" y="301" font-size="18" fill="#e5edf7">Local Ollama / Qwen</text><text x="371" y="327" font-size="14" fill="#a8bacd">Schema-constrained extraction</text><rect x="680" y="270" width="245" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="696" y="301" font-size="18" fill="#e5edf7">Source checks</text><text x="696" y="327" font-size="14" fill="#a8bacd">Validate extracted facts</text><path d="M477 190 L477 225" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M477 225 L152 225" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M152 225 L152 270" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M275 310 L355 310" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 310 L680 310" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M802 270 L802 190" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="355" y="430" width="245" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="371" y="461" font-size="18" fill="#e5edf7">In-memory index</text><text x="371" y="487" font-size="14" fill="#a8bacd">Synchronized resume TF-IDF</text><rect x="680" y="430" width="245" height="80" rx="12" fill="#1e293b" stroke="#486577"/><text x="696" y="461" font-size="18" fill="#e5edf7">Weighted scoring</text><text x="696" y="487" font-size="14" fill="#a8bacd">Text · skills · years · degree</text><path d="M925 150 L960 150" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M960 150 L960 400" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M960 400 L477 400" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M477 400 L477 430" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 470 L680 470" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="453" font-size="17" fill="#e5edf7">Matching request</text><text x="30" y="478" font-size="15" fill="#a8bacd">via FastAPI</text><path d="M190 470 L355 470" fill="none" stroke="#77cfbf" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="560" font-size="17" fill="#77cfbf">Scores, matched skills and skill gaps return to the React workspace.</text></g></svg>