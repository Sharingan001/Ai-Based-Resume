<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Matching score weights: 55, 25, 10, 10 percent</title><desc id="desc">TF-IDF text similarity contributes 55 percent, skill overlap 25 percent, experience 10 percent and education 10 percent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#77cfbf"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#111827"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e5edf7"><text x="30" y="42" font-size="25" fill="#e5edf7">Final score component weights</text><path d="M220,235 L220.0,100.0 A135,135 0 1,1 178.28270575938205,363.3926296998457 Z" fill="#62d5bd" stroke="#111827" stroke-width="3"/><path d="M220,235 L178.28270575938205,363.3926296998457 A135,135 0 0,1 91.60737030015429,193.28270575938205 Z" fill="#a894f4" stroke="#111827" stroke-width="3"/><path d="M220,235 L91.60737030015429,193.28270575938205 A135,135 0 0,1 140.64899094051611,125.78270575938211 Z" fill="#61b6ed" stroke="#111827" stroke-width="3"/><path d="M220,235 L140.64899094051611,125.78270575938211 A135,135 0 0,1 219.99999999999997,100.0 Z" fill="#f3be70" stroke="#111827" stroke-width="3"/><circle cx="220" cy="235" r="88" fill="#111827"/><text x="170" y="235" font-size="33" fill="#e5edf7">100%</text><text x="174" y="260" font-size="17" fill="#a8bacd">weighted</text><rect x="430" y="111" width="18" height="18" rx="4" fill="#62d5bd"/><text x="465" y="130" font-size="20" fill="#e5edf7">55%  TF-IDF text similarity</text><rect x="430" y="173" width="18" height="18" rx="4" fill="#a894f4"/><text x="465" y="192" font-size="20" fill="#e5edf7">25%  Skill overlap</text><rect x="430" y="235" width="18" height="18" rx="4" fill="#61b6ed"/><text x="465" y="254" font-size="20" fill="#e5edf7">10%  Experience</text><rect x="430" y="297" width="18" height="18" rx="4" fill="#f3be70"/><text x="465" y="316" font-size="20" fill="#e5edf7">10%  Education</text><text x="30" y="418" font-size="16" fill="#a8bacd">Heuristic weights, not measured accuracy or hiring probabilities.</text></g></svg>